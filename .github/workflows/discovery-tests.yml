name: Discovery adapter tests

on:
  push:
    branches: [main]
    paths:
      - "api/discovery/**"
      - "test/**"
      - "public/admin.*"
      - "netlify/functions/admin.js"
      - "api/admin.js"
      - ".github/workflows/discovery-tests.yml"
  pull_request:
    paths:
      - "api/discovery/**"
      - "test/**"
      - ".github/workflows/discovery-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check admin JavaScript syntax
        run: node --check public/admin.js && node --check netlify/functions/admin.js && node --check api/admin.js
      - name: Check serverless admin syntax
        run: node --check netlify/functions/admin.js
      - name: Run discovery adapter tests
        run: node --test test/*.test.js
