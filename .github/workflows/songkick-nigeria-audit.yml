name: Songkick Nigeria page audit
on:
  push:
    paths:
      - "scripts/audit-songkick-nigeria.mjs"
      - ".github/workflows/songkick-nigeria-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-songkick-nigeria.mjs
